<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход — Список покупок</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  body {
    background-color: #0f0f0f;
    color: #e5e5e5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }

  .login-card {
    background: #171717;
    padding: 40px 32px;
    border-radius: 12px;
    border: 1px solid #262626;
    width: 100%;
    max-width: 380px;
  }

  .login-header { text-align: center; margin-bottom: 28px; }

  .login-header h2 {
    color: #ffffff;
    font-size: 24px;
    font-weight: 600;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .login-header p { color: #a3a3a3; font-size: 14px; }

  .form-group { margin-bottom: 20px; }

  .form-group label {
    display: block;
    margin-bottom: 8px;
    color: #d4d4d4;
    font-size: 14px;
    font-weight: 500;
  }

  .form-group input {
    width: 100%;
    padding: 12px 14px;
    background-color: #0f0f0f;
    border: 1px solid #262626;
    border-radius: 8px;
    color: #ffffff;
    font-size: 16px; /* 16px, чтобы iPhone не приближал страницу при фокусе */
    transition: border-color 0.15s ease;
    outline: none;
  }

  .form-group input::placeholder { color: #525252; }
  .form-group input:focus { border-color: #737373; }

  .btn-submit {
    width: 100%;
    padding: 12px;
    background-color: #ffffff;
    color: #0f0f0f;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background-color 0.15s ease, opacity 0.15s ease;
    margin-top: 10px;
  }

  .btn-submit:hover { background-color: #e5e5e5; }
  .btn-submit:active { opacity: 0.9; }
  .btn-submit:disabled { opacity: 0.6; cursor: default; }
  .btn-submit:focus-visible { outline: 2px solid #e5e5e5; outline-offset: 3px; }

  .message-box {
    display: none;
    margin-top: 16px;
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    text-align: center;
    background-color: #262626;
    border: 1px solid #404040;
    color: #e5e5e5;
  }
  .message-box.show { display: block; }
</style>
</head>
<body>

  <div class="login-card">
    <div class="login-header">
      <h2>Список покупок</h2>
      <p>Войдите, чтобы увидеть общий список</p>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="login">Почта</label>
        <input type="email" id="login" name="login" placeholder="name@example.com" required autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password">Пароль</label>
        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" class="btn-submit" id="go">Войти</button>

      <div id="statusMessage" class="message-box" role="alert"></div>
    </form>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const statusMsg = document.getElementById('statusMessage');
  const goBtn = document.getElementById('go');

  // Уже вошли раньше — сразу на страницу со списком
  db.auth.getSession().then(({ data }) => {
    if (data.session) location.replace('list.html');
  });

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    goBtn.disabled = true;
    statusMsg.className = 'message-box';

    const { error } = await db.auth.signInWithPassword({
      email: document.getElementById('login').value.trim(),
      password: document.getElementById('password').value
    });

    if (error) {
      statusMsg.textContent = 'Не удалось войти: проверьте почту и пароль.';
      statusMsg.className = 'message-box show';
      goBtn.disabled = false;
      return;
    }
    location.replace('list.html');
  });
</script>
</body>
</html>
