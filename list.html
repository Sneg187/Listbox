<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Список покупок</title>
<style>
  :root { --bg:#e9efea; --ink:#17252a; --accent:#2f6b4f; --line:#b9c7bf; --mute:#7d8f86; --err:#b3412f; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body.hidden { visibility:hidden; }
  main { max-width:520px; margin:0 auto; padding:20px 16px 60px; }
  header { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px; }
  h1 { font-size:1.8rem; margin:0; letter-spacing:-.02em; }
  .link { background:none; border:0; padding:6px 0; font:inherit; color:var(--accent);
          text-decoration:underline; cursor:pointer; }
  form { display:flex; gap:8px; margin-bottom:8px; }
  input[type=text] { flex:1; min-width:0; padding:12px; font:inherit; background:#fff; color:var(--ink);
                     border:1.5px solid var(--line); border-radius:6px; }
  form button { padding:0 18px; font:inherit; font-weight:600; color:#fff; background:var(--accent);
                border:0; border-radius:6px; cursor:pointer; }
  input:focus-visible, button:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  #msg { min-height:1.5em; margin:0 0 8px; color:var(--err); }
  ul { list-style:none; margin:0; padding:0; }
  li { display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--line); }
  li input[type=checkbox] { width:22px; height:22px; accent-color:var(--accent); flex:none; }
  li span { flex:1; overflow-wrap:anywhere; }
  li.done span { color:var(--mute); text-decoration:line-through; }
  li .del { background:none; border:0; font-size:1.3rem; line-height:1; color:var(--mute);
            cursor:pointer; padding:4px 8px; }
  li .del:hover { color:var(--err); }
  .empty { color:#4d6159; padding:16px 4px; }
  footer { margin-top:16px; }
</style>
</head>
<body class="hidden">
<main>
  <header>
    <h1>Купить</h1>
    <button class="link" id="out" type="button">Выйти</button>
  </header>

  <form id="add">
    <input id="title" type="text" placeholder="Например, молоко" aria-label="Название продукта" required>
    <button type="submit">Добавить</button>
  </form>
  <p id="msg" role="alert"></p>

  <ul id="list"></ul>
  <footer><button class="link" id="clear" type="button">Удалить купленное</button></footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const $ = id => document.getElementById(id);
  const say = t => { $('msg').textContent = t || ''; };

  async function load() {
    const { data, error } = await db.from('items').select('*')
      .order('done').order('created_at', { ascending: false });
    if (error) return say('Не удалось загрузить список. Обновите страницу.');
    say();
    const ul = $('list');
    ul.replaceChildren();
    if (!data.length) {
      const p = document.createElement('li');
      p.className = 'empty';
      p.textContent = 'Список пуст. Добавьте первый продукт.';
      ul.append(p);
    }
    for (const it of data) {
      const li = document.createElement('li');
      if (it.done) li.className = 'done';

      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = it.done;
      cb.setAttribute('aria-label', 'Куплено: ' + it.title);
      cb.onchange = async () => {
        const { error } = await db.from('items').update({ done: cb.checked }).eq('id', it.id);
        if (error) say('Не удалось обновить.'); else load();
      };

      const span = document.createElement('span');
      span.textContent = it.title;

      const del = document.createElement('button');
      del.className = 'del'; del.type = 'button'; del.textContent = '×';
      del.setAttribute('aria-label', 'Удалить: ' + it.title);
      del.onclick = async () => {
        const { error } = await db.from('items').delete().eq('id', it.id);
        if (error) say('Не удалось удалить.'); else load();
      };

      li.append(cb, span, del);
      ul.append(li);
    }
  }

  async function start() {
    // Защита страницы: нет сессии — обратно на вход
    const { data } = await db.auth.getSession();
    if (!data.session) return location.replace('index.html');
    document.body.classList.remove('hidden');

    db.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') location.replace('index.html'); });

    $('add').addEventListener('submit', async e => {
      e.preventDefault();
      const title = $('title').value.trim();
      if (!title) return;
      const { error } = await db.from('items').insert({ title });
      if (error) return say('Не удалось добавить.');
      $('title').value = '';
      load();
    });
    $('clear').onclick = async () => {
      const { error } = await db.from('items').delete().eq('done', true);
      if (error) say('Не удалось удалить.'); else load();
    };
    $('out').onclick = () => db.auth.signOut();

    db.channel('items-changes')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, load)
      .subscribe();
    load();
  }
  start();
</script>
</body>
</html>
